<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — AgriMandi</title>
  <meta name="description" content="Set a new password for your AgriMandi account." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌾</span>
        <span>AgriMandi</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="buyer-dashboard.html" class="nav-link">Marketplace</a></li>
        </ul>
      </nav>

      <div class="nav-auth-buttons">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <span style="font-size: 2.2rem; display: inline-block; margin-bottom: 8px;">🔒</span>
            <h1>Set New Password</h1>
            <p>Please enter your new password below.</p>
          </div>

          <!-- Status Message Container -->
          <div id="statusMessage" style="display: none; margin-bottom: 1.25rem;"></div>

          <!-- Reset Password Form -->
          <form id="resetPasswordForm" novalidate>
            <div class="form-group">
              <label for="newPassword" class="form-label">New Password</label>
              <input 
                type="password" 
                id="newPassword" 
                class="form-control" 
                placeholder="At least 6 characters" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="confirmPassword" class="form-label">Confirm New Password</label>
              <input 
                type="password" 
                id="confirmPassword" 
                class="form-control" 
                placeholder="Re-enter your new password" 
                required 
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetSubmitBtn">
              Update Password
            </button>
          </form>

          <div class="auth-footer" style="margin-top: 1.5rem;">
            Return to <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AgriMandi. All rights reserved. Direct Farmer-to-Buyer Marketplace.</p>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("resetPasswordForm");
      const submitBtn = document.getElementById("resetSubmitBtn");
      const statusBox = document.getElementById("statusMessage");

      let isRecoveryReady = false;

      // Check if Supabase client is initialized
      const client = window.agriMandiSupabase ? window.agriMandiSupabase.client : null;

      if (client) {
        // Listen for recovery event
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === "PASSWORD_RECOVERY" || session) {
            isRecoveryReady = true;
          }
        });

        // Also check current session from token in hash
        const { data } = await client.auth.getSession();
        if (data && data.session) {
          isRecoveryReady = true;
        }
      }

      // If after 3 seconds no session or token is detected in URL, warn user
      setTimeout(() => {
        const hash = window.location.hash || window.location.search;
        if (!isRecoveryReady && !hash.includes("access_token") && !hash.includes("code=")) {
          statusBox.style.display = "block";
          statusBox.innerHTML = `
            <div style="padding: 1rem; border-radius: 6px; background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; font-size: 0.9rem;">
              ⚠️ <strong>No active reset link detected.</strong> If your link expired or you navigated here directly, please <a href="forgot-password.html" style="color: #664d03; text-decoration: underline; font-weight: bold;">request a new password reset link</a>.
            </div>
          `;
        }
      }, 2500);

      if (!form) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        let isValid = true;
        if (!newPassword || newPassword.length < 6) {
          showInputError("newPassword", "Password must be at least 6 characters");
          isValid = false;
        } else {
          clearInputError("newPassword");
        }

        if (newPassword !== confirmPassword) {
          showInputError("confirmPassword", "Passwords do not match");
          isValid = false;
        } else {
          clearInputError("confirmPassword");
        }

        if (!isValid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating password...";
        statusBox.style.display = "none";

        try {
          const { user, error } = await window.agriMandiSupabase.updatePassword(newPassword);

          if (error) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Update Password";
            statusBox.style.display = "block";
            statusBox.innerHTML = `
              <div style="padding: 1rem; border-radius: 6px; background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; font-size: 0.9rem;">
                ❌ ${escapeHtml(error.message || "Failed to update password. Your reset link may have expired.")}
              </div>
            `;
            return;
          }

          // Success
          form.style.display = "none";
          statusBox.style.display = "block";
          statusBox.innerHTML = `
            <div style="padding: 1.5rem; text-align: center; border-radius: 8px; background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc;">
              <h3 style="margin-top: 0; font-size: 1.25rem;">✅ Password Changed Successfully!</h3>
              <p style="margin-bottom: 1rem;">Your new password has been set. Redirecting you to the sign-in page...</p>
              <a href="login.html" class="btn btn-primary" style="display: inline-block;">Sign In Now</a>
            </div>
          `;

          // Clear recovery session and redirect
          setTimeout(async () => {
            if (window.agriMandiSupabase) {
              await window.agriMandiSupabase.signOut();
            }
            window.location.href = "login.html";
          }, 2000);
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
          showToast("An unexpected error occurred while updating password.", "error");
        }
      });
    });
  </script>
</body>
</html>
