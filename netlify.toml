# ==============================================================================
# AgriMandi Frontend - Netlify Configuration
# ==============================================================================
# Static site deployment configuration with deploy-time config generation,
# comprehensive security headers, and clean URL redirects.
# ==============================================================================

[build]
  # Build command executes the tiny Node.js script to write config.js from env vars
  command = "node scripts/build-config.js"
  publish = "."

# Global HTTP security headers for all frontend assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.onrender.com http://localhost:5000 http://127.0.0.1:5000;"

# Cache static CSS and JS assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Optional redirect: clean fallback for unknown root routes
[[redirects]]
  from = "/farmer"
  to = "/farmer-dashboard.html"
  status = 200

[[redirects]]
  from = "/buyer"
  to = "/buyer-dashboard.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/forgot-password.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200
