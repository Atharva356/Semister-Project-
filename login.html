<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AgriMandi</title>
  <meta name="description" content="Sign in to your AgriMandi account as a Farmer or Buyer." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌾</span>
        <span>AgriMandi</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="buyer-dashboard.html" class="nav-link">Marketplace</a></li>
        </ul>
      </nav>

      <div class="nav-auth-buttons">
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <span style="font-size: 2.2rem; display: inline-block; margin-bottom: 8px;">🔐</span>
            <h1>Welcome Back</h1>
            <p>Log in to access your agricultural marketplace</p>
          </div>

          <!-- Login Form -->
          <form id="loginForm" novalidate>
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input 
                type="email" 
                id="email" 
                class="form-control" 
                placeholder="name@example.com" 
                required 
              />
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                <a href="forgot-password.html" style="font-size: 0.85rem; color: #2d6a4f; text-decoration: none; font-weight: 500;">Forgot password?</a>
              </div>
              <input 
                type="password" 
                id="password" 
                class="form-control" 
                placeholder="Enter your password" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="role" class="form-label">I am logging in as a</label>
              <select id="role" class="form-select" required>
                <option value="farmer">🚜 Farmer (Sell Produce)</option>
                <option value="buyer">🛒 Buyer (Purchase Produce)</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
              Sign In to AgriMandi
            </button>
          </form>

          <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AgriMandi. All rights reserved. Direct Farmer-to-Buyer Marketplace.</p>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    // Pre-select role if specified in query parameter (e.g., login.html?role=buyer)
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = urlParams.get('role');
    if (roleParam && (roleParam === 'farmer' || roleParam === 'buyer')) {
      const roleSelect = document.getElementById('role');
      if (roleSelect) roleSelect.value = roleParam;
    }
  </script>
</body>
</html>
