<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — AgriMandi</title>
  <meta name="description" content="Reset your AgriMandi account password." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Site Navigation -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🌾</span>
        <span>AgriMandi</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="buyer-dashboard.html" class="nav-link">Marketplace</a></li>
        </ul>
      </nav>

      <div class="nav-auth-buttons">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <span style="font-size: 2.2rem; display: inline-block; margin-bottom: 8px;">🔑</span>
            <h1>Reset Your Password</h1>
            <p>Enter your registered email to receive a password recovery link.</p>
          </div>

          <!-- Status Message Container -->
          <div id="statusMessage" style="display: none; margin-bottom: 1.25rem;"></div>

          <!-- Forgot Password Form -->
          <form id="forgotPasswordForm" novalidate>
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input 
                type="email" 
                id="email" 
                class="form-control" 
                placeholder="name@example.com" 
                required 
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotSubmitBtn">
              Send Recovery Link
            </button>
          </form>

          <div class="auth-footer" style="margin-top: 1.5rem;">
            Remember your password? <a href="login.html">Sign in here</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AgriMandi. All rights reserved. Direct Farmer-to-Buyer Marketplace.</p>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("forgotPasswordForm");
      const submitBtn = document.getElementById("forgotSubmitBtn");
      const statusBox = document.getElementById("statusMessage");

      if (!form) return;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          showInputError("email", "Please enter a valid email address");
          return;
        }
        clearInputError("email");

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending link...";
        statusBox.style.display = "none";

        try {
          const redirectTo = window.location.origin + "/reset-password.html";
          const { error } = await window.agriMandiSupabase.resetPasswordForEmail(email, redirectTo);

          if (error) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Recovery Link";
            statusBox.style.display = "block";
            statusBox.innerHTML = `
              <div style="padding: 1rem; border-radius: 6px; background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; font-size: 0.9rem;">
                ❌ ${escapeHtml(error.message || "Failed to send reset email. Please try again.")}
              </div>
            `;
            return;
          }

          // Success feedback
          form.style.display = "none";
          statusBox.style.display = "block";
          statusBox.innerHTML = `
            <div style="padding: 1.5rem; text-align: center; border-radius: 8px; background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc;">
              <h3 style="margin-top: 0; font-size: 1.25rem;">📬 Recovery Link Sent!</h3>
              <p style="margin-bottom: 0.75rem;">If an account exists for <strong>${escapeHtml(email)}</strong>, you will receive an email shortly with instructions to reset your password.</p>
              <p style="font-size: 0.85rem; color: #146c43; margin-bottom: 1.25rem;">Be sure to check your spam or junk folder if you don't see it within a few minutes.</p>
              <a href="login.html" class="btn btn-primary btn-sm" style="display: inline-block;">Back to Sign In</a>
            </div>
          `;
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Recovery Link";
          showToast("An unexpected error occurred. Please try again.", "error");
        }
      });
    });
  </script>
</body>
</html>
